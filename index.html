<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>車両入出庫管理</title>
<link rel="icon" href="data:,">
<style>
/* ===== ユニバーサルデザイン対応（高齢者・色弱者） =====
   ・文字サイズ大きめ（最小20px、ラベルは24px）
   ・ボタン高さ十分（タップしやすい）
   ・色弱対応：赤緑を識別色に使わず、青・オレンジ・グレーで区別
   ・コントラスト強化（文字は#111、補助文字も#555以上）
   ・入庫中バッジ→青枠＋太字、出庫済み→グレー＋斜線ラベル
========================================================= */

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;background:#f0f0f0;color:#111;font-size:20px;line-height:1.6}

/* ===== タブバー ===== */
.tab-bar{display:flex;background:#0d47a1;position:sticky;top:0;z-index:100;border-bottom:4px solid #ffa000}
.tab-btn{flex:1;padding:16px 8px 20px;color:rgba(255,255,255,0.6);border:none;background:transparent;font-size:17px;cursor:pointer;border-bottom:6px solid transparent;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;transition:background .2s,color .2s,border-color .2s}
.tab-btn .tab-icon{font-size:30px;line-height:1}
.tab-btn .tab-label{font-size:17px;letter-spacing:1px}
.tab-btn.active{color:#fff;border-bottom:7px solid #ffa000;background:rgba(255,255,255,0.18);font-weight:800}
.tab-btn.active .tab-label{font-size:19px;font-weight:800}
.tab-btn.active .tab-icon{font-size:34px}

/* ===== メインビュー ===== */
.view{padding:20px;max-width:600px;margin:0 auto}

/* ===== フォームフィールド ===== */
.field{margin-bottom:24px}
.field label{display:block;font-size:22px;font-weight:800;margin-bottom:10px;color:#111}
.field input{width:100%;padding:18px 20px;font-size:22px;border:3px solid #999;border-radius:12px;background:#fff;color:#111}
.field input:focus{outline:none;border-color:#0d47a1;box-shadow:0 0 0 3px rgba(13,71,161,0.25)}
.field .hint{font-size:18px;color:#555;margin-top:6px;font-weight:500}

/* ===== カメラエリア ===== */
.camera-area{border:3px dashed #888;border-radius:14px;background:#fafafa;padding:26px 20px;text-align:center;cursor:pointer;margin-bottom:10px}
.camera-area:active{border-color:#0d47a1;background:#e8f0ff}
.camera-icon{font-size:56px;margin-bottom:10px;display:block}
.camera-label{font-size:20px;font-weight:800;color:#0d47a1}
.camera-hint{font-size:17px;color:#555;margin-top:6px}
#camera-input{display:none}
#gallery-input{display:none}
#preview-wrap{display:none;margin-top:14px}
#plate-preview{width:100%;max-height:220px;object-fit:contain;border-radius:10px;border:2px solid #ccc}
.ocr-result{margin-top:12px;padding:14px 18px;background:#e3f2fd;border-radius:10px;border-left:5px solid #0d47a1;font-size:18px;color:#111}
.ocr-result b{font-size:24px;color:#0d47a1}
.ocr-loading{display:none;padding:12px;text-align:center;color:#444;font-size:19px}

/* ===== メインボタン ===== */
.btn-primary{width:100%;padding:26px;font-size:26px;font-weight:800;background:#0d47a1;color:#fff;border:none;border-radius:14px;cursor:pointer;margin-top:10px;letter-spacing:2px;box-shadow:0 4px 0 #083070}
.btn-primary:active{background:#083070;transform:translateY(3px);box-shadow:none}

/* ===== 成功メッセージ ===== */
#success-msg{display:none;background:#e3f2fd;border:3px solid #0d47a1;border-radius:12px;padding:20px;margin-top:18px;text-align:center;font-size:22px;color:#0d47a1;font-weight:800}

/* ===== 一覧ヘッダー ===== */
.list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.list-header h2{font-size:21px;font-weight:800}

/* CSV・インポートボタン */
.btn-csv{padding:14px 20px;font-size:18px;font-weight:800;background:#0d47a1;color:#fff;border:none;border-radius:10px;cursor:pointer}

/* ===== 統計カード ===== */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
.stat-card{background:#fff;border-radius:12px;padding:14px 8px;text-align:center;border:2px solid #ddd}
.stat-num{font-size:32px;font-weight:800;color:#0d47a1}
.stat-label{font-size:16px;color:#444;margin-top:4px;font-weight:600}

/* ===== 記録カード ===== */
.record-list{display:flex;flex-direction:column;gap:12px}
.record-card{background:#fff;border-radius:14px;border:2px solid #ccc;padding:18px 20px;cursor:pointer;transition:box-shadow .15s}
.record-card:active{box-shadow:0 0 0 3px #0d47a1}
.record-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.record-name{font-size:22px;font-weight:800;color:#111}
.plate-num{font-size:22px;font-weight:800;color:#0d47a1;font-family:monospace;letter-spacing:3px}
.record-card-mid{font-size:19px;color:#444;margin-bottom:10px;font-weight:500}
.record-card-bot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.time-info{font-size:18px;color:#444;font-weight:500}

/* 色弱対応バッジ：青枠＋パターンで入庫中を表現 */
.badge-in{background:#e3f2fd;color:#0d47a1;padding:6px 16px;border-radius:20px;font-size:17px;font-weight:800;border:2px solid #0d47a1}
/* 出庫済みはグレー背景＋取り消し線で明示 */
.badge-out{background:#e8e8e8;color:#555;padding:6px 16px;border-radius:20px;font-size:17px;font-weight:700;border:2px solid #999}

/* 出庫ボタン：オレンジ（青と明確に区別） */
.btn-checkout{padding:14px 22px;font-size:19px;font-weight:800;background:#e65100;color:#fff;border:none;border-radius:10px;cursor:pointer;box-shadow:0 3px 0 #9a3800;min-width:100px}
.btn-checkout:active{transform:translateY(2px);box-shadow:none}

.empty-state{text-align:center;padding:52px 20px;color:#666;font-size:20px}

/* 保存バッジ */
.save-badge{background:#e3f2fd;border:2px solid #0d47a1;border-radius:10px;padding:12px 16px;font-size:18px;color:#0d47a1;margin-bottom:20px;display:flex;align-items:center;gap:8px;font-weight:600}

/* ===== モーダル ===== */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.55);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:22px;font-weight:800;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;color:#111}
.modal-close{background:#e0e0e0;border:none;font-size:26px;cursor:pointer;color:#333;padding:4px 12px;border-radius:8px;font-weight:700}
.modal-field{margin-bottom:18px}
.modal-field label{display:block;font-size:20px;color:#333;margin-bottom:6px;font-weight:700}
.modal-field input{width:100%;padding:16px 18px;font-size:22px;border:3px solid #aaa;border-radius:12px;background:#fff;color:#111}
.modal-field input:focus{outline:none;border-color:#0d47a1;box-shadow:0 0 0 3px rgba(13,71,161,0.2)}
.modal-actions{display:flex;gap:12px;margin-top:20px}
.btn-save{flex:2;padding:20px;font-size:22px;font-weight:800;background:#0d47a1;color:#fff;border:none;border-radius:12px;cursor:pointer}
/* 削除ボタン：オレンジ系（赤と緑の混同を避ける） */
.btn-delete{flex:1;padding:20px;font-size:22px;font-weight:800;background:#bf360c;color:#fff;border:none;border-radius:12px;cursor:pointer}

/* ===== トースト ===== */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:16px 30px;border-radius:32px;font-size:19px;display:none;z-index:999;white-space:nowrap;font-weight:700}

/* ===== CSV出力モーダル ===== */
.csv-modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.55);z-index:300;align-items:center;justify-content:center;padding:16px}
.csv-modal-overlay.open{display:flex}
.csv-modal{background:#fff;border-radius:18px;padding:26px;width:100%;max-width:420px}
.csv-modal-title{font-size:22px;font-weight:800;margin-bottom:22px;text-align:center;color:#111}
.csv-btn-group{display:flex;flex-direction:column;gap:14px}
.btn-csv-opt{width:100%;padding:22px 18px;font-size:20px;font-weight:800;border:3px solid transparent;border-radius:14px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px}
/* CSV選択肢：色でなく背景パターン＋太字ラベルで区別 */
.btn-csv-today{background:#e3f2fd;color:#0d47a1;border-color:#0d47a1}
.btn-csv-date{background:#fff8e1;color:#5d4037;border-color:#ffa000}
.btn-csv-all{background:#f3e5f5;color:#4a148c;border-color:#7b1fa2}
.csv-date-row{display:none;flex-direction:column;gap:10px}
.csv-date-row.show{display:flex}
.csv-date-input{width:100%;padding:14px 16px;font-size:20px;border:3px solid #0d47a1;border-radius:12px;background:#fff;color:#111}
.btn-csv-do{width:100%;padding:18px;font-size:20px;font-weight:800;background:#0d47a1;color:#fff;border:none;border-radius:12px;cursor:pointer;margin-top:4px}
.btn-csv-cancel{width:100%;padding:16px;font-size:19px;font-weight:700;background:#e0e0e0;color:#333;border:none;border-radius:12px;cursor:pointer;margin-top:8px}

/* ===== ナンバー検索 ===== */
.search-box{display:flex;gap:10px;margin-bottom:16px;align-items:center}
.search-input{flex:1;padding:16px 18px;font-size:22px;border:3px solid #aaa;border-radius:12px;background:#fff;color:#111;font-family:monospace;letter-spacing:3px}
.search-input:focus{outline:none;border-color:#0d47a1;box-shadow:0 0 0 3px rgba(13,71,161,0.2)}
.btn-search-clear{padding:14px 18px;font-size:18px;font-weight:800;background:#ccc;color:#111;border:none;border-radius:10px;cursor:pointer;white-space:nowrap}
.search-result-label{font-size:19px;color:#0d47a1;font-weight:800;background:#e3f2fd;border-radius:10px;padding:10px 16px;margin-bottom:12px;display:none;border-left:5px solid #0d47a1}
.record-card.search-match{border:3px solid #0d47a1;background:#f0f7ff}

/* ===== ステータスフィルターボタン ===== */
.filter-btn-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.btn-filter{padding:12px 18px;font-size:18px;font-weight:700;background:#e0e0e0;color:#444;border:2px solid #bbb;border-radius:10px;cursor:pointer}
.btn-filter.f-active{background:#0d47a1;color:#fff;border-color:#0d47a1;font-weight:800}

/* ===== CSV読み込み・ストレージ削除 ===== */
.btn-import{padding:14px 20px;font-size:18px;font-weight:800;background:#5e35b1;color:#fff;border:none;border-radius:10px;cursor:pointer}
#csv-import-input{display:none}
.btn-danger-sm{padding:10px 16px;font-size:17px;font-weight:800;background:#bf360c;color:#fff;border:none;border-radius:8px;cursor:pointer}
.import-mode-row{display:flex;flex-direction:column;gap:10px;margin-top:10px;padding:16px;background:#f3e5f5;border-radius:12px;border:2px solid #7b1fa2}
.import-mode-row label{font-size:19px;color:#333;font-weight:700}
.import-mode-select{width:100%;padding:14px 16px;font-size:19px;border:3px solid #7b1fa2;border-radius:10px;background:#fff;color:#111}
.btn-import-do{width:100%;padding:18px;font-size:20px;font-weight:800;background:#5e35b1;color:#fff;border:none;border-radius:12px;cursor:pointer;margin-top:6px}

/* ===== 確認モーダル ===== */
.confirm-modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:400;align-items:center;justify-content:center;padding:16px}
.confirm-modal-overlay.open{display:flex}
.confirm-modal{background:#fff;border-radius:18px;padding:28px;width:100%;max-width:380px;text-align:center;border-top:6px solid #bf360c}
.confirm-modal-icon{font-size:56px;margin-bottom:14px}
.confirm-modal-msg{font-size:20px;color:#111;line-height:1.7;margin-bottom:24px;font-weight:600}
.confirm-modal-actions{display:flex;gap:12px}
.btn-confirm-ok{flex:1;padding:20px;font-size:20px;font-weight:800;background:#bf360c;color:#fff;border:none;border-radius:12px;cursor:pointer}
.btn-confirm-cancel{flex:1;padding:20px;font-size:20px;font-weight:800;background:#e0e0e0;color:#333;border:none;border-radius:12px;cursor:pointer}
</style>
</head>
<body>

<div class="tab-bar">
  <button class="tab-btn active" onclick="showView('entry')">
    <span class="tab-icon">🚗</span>
    <span class="tab-label">入　庫</span>
  </button>
  <button class="tab-btn" onclick="showView('list')">
    <span class="tab-icon">📋</span>
    <span class="tab-label">一覧・出庫</span>
  </button>
</div>
<div id="toast"></div>

<!-- 入庫フォーム -->
<div id="entry-view" class="view">
  <div class="save-badge" style="justify-content:space-between;flex-wrap:wrap">
    <span>💾 データはこの端末に自動保存されます</span>
    <button class="btn-danger-sm" onclick="confirmClearStorage()" style="font-size:16px;padding:10px 16px">🗑️ データ全削除</button>
  </div>
  <div class="field">
    <label>訪問者名（会社名）</label>
    <input type="text" id="visitor-name" placeholder="例：山田太郎 / 〇〇株式会社">
  </div>
  <div class="field">
    <label>訪問先（担当部署・担当者）</label>
    <input type="text" id="destination" placeholder="例：営業部 鈴木">
  </div>
  <div class="field">
    <label>ナンバープレート</label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div class="camera-area" style="margin-bottom:0" onclick="document.getElementById('camera-input').click()">
        <span class="camera-icon">📷</span>
        <div class="camera-label">カメラ撮影</div>
        <div class="camera-hint">タップして起動</div>
      </div>
      <div class="camera-area" style="margin-bottom:0" onclick="document.getElementById('gallery-input').click()">
        <span class="camera-icon">🖼️</span>
        <div class="camera-label">写真から選ぶ</div>
        <div class="camera-hint">フォルダーから選択</div>
      </div>
    </div>
    <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handlePhoto(this)">
    <input type="file" id="gallery-input" accept="image/*" onchange="handlePhoto(this)">
    <div id="preview-wrap">
      <img id="plate-preview" src="" alt="プレート画像">
      <div class="ocr-loading" id="ocr-loading">🔍 ナンバーを読み取り中…</div>
      <div class="ocr-result" id="ocr-result" style="display:none"></div>
    </div>
    <input type="text" id="plate-number" placeholder="数字4桁（例：1234）" inputmode="numeric" maxlength="4" oninput="autofillFromPlate()" style="margin-top:10px;width:100%;padding:18px 20px;font-size:28px;border:3px solid #999;border-radius:12px;font-family:monospace;letter-spacing:4px;color:#111">
    <div class="hint">・を除いた数字部分のみ入力</div>
  </div>
  <button class="btn-primary" onclick="register()">入　庫　登　録</button>
  <div id="success-msg">✅ 入庫登録が完了しました！</div>
</div>

<!-- 一覧・出庫 -->
<div id="list-view" class="view" style="display:none">
  <div class="list-header">
    <h2 id="today-label"></h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn-import" onclick="openImportModal()">📂 CSV読込</button>
      <button class="btn-csv" onclick="openCsvModal()">📥 CSV出力</button>
    </div>
  </div>
  <!-- ナンバー検索 -->
  <div class="search-box">
    <input type="text" id="search-plate" class="search-input" placeholder="🔍 ナンバーで検索" inputmode="numeric" maxlength="4"
      oninput="onSearchInput()" onkeydown="if(event.key==='Enter')doSearch()">
    <button class="btn-search-clear" id="btn-search-clear" onclick="clearSearch()" style="display:none">✕ クリア</button>
  </div>
  <!-- 日付検索 -->
  <div class="search-box" style="margin-bottom:10px">
    <input type="date" id="search-date" class="search-input" style="letter-spacing:normal;font-size:19px"
      oninput="onDateSearchInput()">
    <button class="btn-search-clear" id="btn-date-clear" onclick="clearDateSearch()" style="display:none">✕ クリア</button>
  </div>
  <!-- ステータスフィルター -->
  <div class="filter-btn-row">
    <button id="btn-filter-all" class="btn-filter f-active" onclick="setStatusFilter('all')">すべて</button>
    <button id="btn-filter-in" class="btn-filter" onclick="setStatusFilter('in')">入庫中</button>
    <button id="btn-filter-out" class="btn-filter" onclick="setStatusFilter('out')">出庫済み</button>
  </div>
  <div class="search-result-label" id="search-result-label"></div>
  <div class="stats">
    <div class="stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-label">本日合計</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-in" style="color:#0d47a1">0</div><div class="stat-label">入庫中</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-out" style="color:#555">0</div><div class="stat-label">出庫済み</div></div>
  </div>
  <div class="record-list" id="record-list"></div>
  <div class="empty-state" id="empty-state">まだ記録がありません</div>
</div>

<!-- 編集モーダル -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">
      <span>記録を編集</span>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-field">
      <label>訪問者名（会社名）</label>
      <input type="text" id="edit-name">
    </div>
    <div class="modal-field">
      <label>訪問先</label>
      <input type="text" id="edit-dest">
    </div>
    <div class="modal-field">
      <label>ナンバー（数字のみ）</label>
      <input type="text" id="edit-plate" inputmode="numeric" maxlength="4">
    </div>
    <div class="modal-field">
      <label>入庫時刻</label>
      <input type="time" id="edit-intime">
    </div>
    <div class="modal-field">
      <label>出庫時刻（未出庫は空欄）</label>
      <input type="time" id="edit-outtime">
    </div>
    <div class="modal-actions">
      <button class="btn-save" onclick="saveEdit()">保　存</button>
      <button class="btn-delete" onclick="deleteRecord()">削　除</button>
    </div>
    <button id="btn-revert" onclick="revertToParked()" style="display:none;width:100%;margin-top:12px;padding:20px;font-size:22px;font-weight:800;background:#e65100;color:#fff;border:3px solid #9a3800;border-radius:12px;cursor:pointer">↩️ 入庫中に戻す</button>
  </div>
</div>

<!-- CSV出力モーダル -->
<div class="csv-modal-overlay" id="csv-modal-overlay" onclick="closeCsvModalOutside(event)">
  <div class="csv-modal">
    <div class="csv-modal-title">📥 CSV出力　範囲を選択</div>
    <div class="csv-btn-group">
      <button class="btn-csv-opt btn-csv-today" onclick="doDownloadCSV('today')">📅　今日のデータ</button>
      <button class="btn-csv-opt btn-csv-date" onclick="toggleDatePicker()">🗓️　日付を指定して出力</button>
      <div class="csv-date-row" id="csv-date-row">
        <input type="date" id="csv-date-input" class="csv-date-input">
        <button class="btn-csv-do" onclick="doDownloadCSV('date')">この日のデータを出力</button>
      </div>
      <button class="btn-csv-opt btn-csv-all" onclick="doDownloadCSV('all')">📋　全期間のデータ</button>
    </div>
    <button class="btn-csv-cancel" onclick="closeCsvModal()">キャンセル</button>
  </div>
</div>

<!-- CSV読み込みモーダル -->
<div class="csv-modal-overlay" id="import-modal-overlay" onclick="closeImportModalOutside(event)">
  <div class="csv-modal">
    <div class="csv-modal-title">📂 CSV読み込み（上書き）</div>
    <div class="csv-btn-group">
      <div class="import-mode-row">
        <label>読み込み方法を選択</label>
        <select class="import-mode-select" id="import-mode">
          <option value="overwrite">🔄 全データを上書き（置き換え）</option>
          <option value="merge">➕ 既存データに追記（重複除外）</option>
        </select>
      </div>
      <div style="padding:10px 0 0">
        <label style="font-size:19px;color:#333;font-weight:700;display:block;margin-bottom:10px">CSVファイルを選択</label>
        <input type="file" id="csv-import-input" accept=".csv,text/csv" onchange="onCsvFileSelected(this)">
        <button class="btn-import-do" onclick="document.getElementById('csv-import-input').click()">📁 ファイルを選ぶ</button>
        <div id="import-file-name" style="margin-top:10px;font-size:17px;color:#333;text-align:center;font-weight:600"></div>
      </div>
      <button class="btn-import-do" id="btn-do-import" onclick="doImportCSV()" style="display:none;background:#27ae60">✅ 読み込みを実行</button>
    </div>
    <button class="btn-csv-cancel" onclick="closeImportModal()">キャンセル</button>
  </div>
</div>

<!-- 確認モーダル（ストレージ全削除） -->
<div class="confirm-modal-overlay" id="confirm-modal-overlay">
  <div class="confirm-modal">
    <div class="confirm-modal-icon">⚠️</div>
    <div class="confirm-modal-msg" id="confirm-modal-msg">本当にすべてのデータを削除しますか？<br><b>この操作は元に戻せません。</b></div>
    <div class="confirm-modal-actions">
      <button class="btn-confirm-cancel" onclick="closeConfirmModal()">キャンセル</button>
      <button class="btn-confirm-ok" id="btn-confirm-ok" onclick="executeClearStorage()">全削除する</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY='parking_records';
let records=[];
let editingId=null;
let statusFilter='all';
let autofillTimer=null;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

let touchStartY=0;
let touchMoved=false;
function touchStart(e){
  touchStartY=e.touches[0].clientY;
  touchMoved=false;
}
function touchEnd(e,id){
  const diff=Math.abs(e.changedTouches[0].clientY-touchStartY);
  if(diff>10){touchMoved=true;return;}
  e.preventDefault();
  openEdit(id);
}

function loadRecords(){
  try{const d=localStorage.getItem(STORAGE_KEY);return d?JSON.parse(d):[];}catch(e){return [];}
}
function saveRecords(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(records));}catch(e){toast('保存に失敗しました');}
}
records=loadRecords();

function showView(v){
  document.getElementById('entry-view').style.display=v==='entry'?'block':'none';
  document.getElementById('list-view').style.display=v==='list'?'block':'none';
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(v==='entry'&&i===0)||(v==='list'&&i===1)));
  if(v==='list'){
    const di=document.getElementById('search-date');
    if(!di.value){di.value=today();document.getElementById('btn-date-clear').style.display='inline-block';}
    renderList();
  }
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>t.style.display='none',2500);
}

async function handlePhoto(inp){
  const file=inp.files[0];if(!file)return;
  const wrap=document.getElementById('preview-wrap');
  const img=document.getElementById('plate-preview');
  const loading=document.getElementById('ocr-loading');
  const result=document.getElementById('ocr-result');
  wrap.style.display='block';result.style.display='none';loading.style.display='block';
  const reader=new FileReader();
  reader.onload=async e=>{
    img.src=e.target.result;
    const b64=e.target.result.split(',')[1];
    const mediaType=file.type||'image/jpeg';
    const num=await ocrPlate(b64,mediaType);
    loading.style.display='none';
    if(num){
      document.getElementById('plate-number').value=num;
      result.style.display='block';
      result.innerHTML='読み取り結果：<b>'+num+'</b>　<span style="font-size:13px;color:#888">（修正可能）</span>';
    }else{
      result.style.display='block';
      result.innerHTML='<span style="color:#c0392b">読み取りできませんでした。手動で入力してください。</span>';
    }
  };
  reader.readAsDataURL(file);
}

async function ocrPlate(b64,mediaType){
  try{
    const res=await fetch('https://us-central1-parking-2bd69.cloudfunctions.net/ocrPlate',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({b64,mediaType:mediaType||'image/jpeg'})
    });
    const data=await res.json();
    return data.number||null;
  }catch(e){return null;}
}

function now(){
  const d=new Date();
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}
function today(){
  const d=new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');
}
function todayJP(){
  const d=new Date();
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+['日','月','火','水','木','金','土'][d.getDay()]+'）';
}

function register(){
  const name=document.getElementById('visitor-name').value.trim();
  const dest=document.getElementById('destination').value.trim();
  const plate=document.getElementById('plate-number').value.trim();
  if(!plate||!/^\d{1,4}$/.test(plate)){toast('ナンバーを1〜4桁の数字で入力してください');return;}
  const finalName=name||'不明';
  const finalDest=dest||'不明';
  document.activeElement.blur();
  records.push({id:Date.now(),date:today(),inTime:now(),outTime:null,name:finalName,dest:finalDest,plate});
  saveRecords();
  document.getElementById('visitor-name').value='';
  document.getElementById('destination').value='';
  document.getElementById('plate-number').value='';
  document.getElementById('preview-wrap').style.display='none';
  document.getElementById('ocr-result').style.display='none';
  const msg=document.getElementById('success-msg');
  msg.style.display='block';
  setTimeout(()=>msg.style.display='none',3000);
}

function checkout(id,e){
  e.stopPropagation();
  const r=records.find(r=>r.id===id);
  if(r){r.outTime=now();saveRecords();}
  renderList();
}

function openEdit(id){
  const r=records.find(r=>r.id===id);
  if(!r)return;
  editingId=id;
  document.getElementById('edit-name').value=r.name;
  document.getElementById('edit-dest').value=r.dest||'';
  document.getElementById('edit-plate').value=r.plate;
  document.getElementById('edit-intime').value=r.inTime;
  document.getElementById('edit-outtime').value=r.outTime||'';
  document.getElementById('btn-revert').style.display=r.outTime?'block':'none';
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e){
  if(e.target===document.getElementById('modal-overlay'))closeModalDirect();
}
function closeModalDirect(){
  document.getElementById('modal-overlay').classList.remove('open');
  editingId=null;
}

function saveEdit(){
  document.activeElement.blur();
  const r=records.find(r=>r.id===editingId);
  if(!r)return;
  const name=document.getElementById('edit-name').value.trim();
  const plate=document.getElementById('edit-plate').value.trim();
  if(!name){toast('訪問者名を入力してください');return;}
  if(!plate||!/^\d{1,4}$/.test(plate)){toast('ナンバーは1〜4桁の数字で入力してください');return;}
  r.name=name;
  r.dest=document.getElementById('edit-dest').value.trim();
  r.plate=plate;
  r.inTime=document.getElementById('edit-intime').value.trim();
  const ot=document.getElementById('edit-outtime').value.trim();
  r.outTime=ot||null;
  saveRecords();
  closeModalDirect();
  renderList();
  toast('修正しました');
}

function revertToParked(){
  if(!confirm('出庫済みを入庫中に戻しますか？'))return;
  const r=records.find(r=>r.id===editingId);
  if(!r)return;
  r.outTime=null;
  saveRecords();
  closeModalDirect();
  renderList();
  toast('入庫中に戻しました');
}

function deleteRecord(){
  if(!confirm('この記録を削除しますか？'))return;
  records=records.filter(r=>r.id!==editingId);
  saveRecords();
  closeModalDirect();
  renderList();
  toast('削除しました');
}

function normalizeDate(s){
  if(!s)return null;
  const m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(!m)return null;
  return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
}

function autofillFromPlate(){
  clearTimeout(autofillTimer);
  autofillTimer=setTimeout(()=>{
    const plate=document.getElementById('plate-number').value.trim();
    if(!plate||!/^\d{1,4}$/.test(plate))return;
    const matched=records.filter(r=>r.plate===plate);
    if(!matched.length)return;
    const latest=[...matched].sort((a,b)=>(b.date+'T'+b.inTime).localeCompare(a.date+'T'+a.inTime))[0];
    let filled=false;
    if(latest.name&&latest.name!=='不明'){document.getElementById('visitor-name').value=latest.name;filled=true;}
    if(latest.dest){document.getElementById('destination').value=latest.dest;filled=true;}
    if(filled)toast('📋 訪問者名・訪問先を自動入力しました');
  },300);
}

function setStatusFilter(mode){
  statusFilter=mode;
  document.getElementById('btn-filter-all').className='btn-filter'+(mode==='all'?' f-active':'');
  document.getElementById('btn-filter-in').className='btn-filter'+(mode==='in'?' f-active':'');
  document.getElementById('btn-filter-out').className='btn-filter'+(mode==='out'?' f-active':'');
  renderList();
}

function onDateSearchInput(){
  const val=document.getElementById('search-date').value.trim();
  document.getElementById('btn-date-clear').style.display=val?'inline-block':'none';
  renderList();
}

function clearDateSearch(){
  document.getElementById('search-date').value='';
  document.getElementById('btn-date-clear').style.display='none';
  renderList();
}

function onSearchInput(){
  const val=document.getElementById('search-plate').value.trim();
  document.getElementById('btn-search-clear').style.display=val?'inline-block':'none';
  renderList();
}

function doSearch(){
  document.activeElement.blur();
  renderList();
}

function clearSearch(){
  document.getElementById('search-plate').value='';
  document.getElementById('btn-search-clear').style.display='none';
  renderList();
}

function renderList(){
  const td=today();
  const searchPlate=document.getElementById('search-plate').value.trim();
  const searchDateRaw=document.getElementById('search-date').value.trim();
  const searchDate=normalizeDate(searchDateRaw);
  const hasPlateFilter=searchPlate.length>0;
  const hasDateFilter=!!searchDate;
  const hasStatusFilter=statusFilter!=='all';
  const hasAnyFilter=hasPlateFilter||hasDateFilter||hasStatusFilter;
  // 初期表示判定：日付=今日・すべて・ナンバー未入力 → 通常の今日表示
  const isDefaultView=hasDateFilter&&searchDate===td&&!hasStatusFilter&&!hasPlateFilter;
  const resultLabel=document.getElementById('search-result-label');
  let filtered;

  if(!hasAnyFilter){
    // 日付が空の場合（クリア後など）→ 今日のデータ
    filtered=records.filter(r=>r.date===td);
    document.getElementById('today-label').textContent=todayJP();
    resultLabel.style.display='none';
  }else{
    // フィルターモード（全データから絞り込み）
    filtered=[...records];

    // ナンバーフィルター（0000で全表示、それ以外は先頭0除去して検索）
    if(hasPlateFilter&&searchPlate!=='0000'){
      const startsWithZero=searchPlate.startsWith('0');
      const effectiveVal=searchPlate.replace(/^0+/,'');
      filtered=filtered.filter(r=>effectiveVal?(startsWithZero?r.plate===effectiveVal:r.plate.includes(effectiveVal)):false);
    }

    // 日付フィルター（入庫日時基準）
    if(hasDateFilter)filtered=filtered.filter(r=>r.date===searchDate);

    // ステータスフィルター
    if(statusFilter==='in')filtered=filtered.filter(r=>!r.outTime);
    else if(statusFilter==='out')filtered=filtered.filter(r=>r.outTime);

    filtered.sort((a,b)=>a.date.localeCompare(b.date)||a.inTime.localeCompare(b.inTime));

    if(isDefaultView){
      // 初期表示は今日の日付ヘッダーのみ（検索ラベル非表示）
      document.getElementById('today-label').textContent=todayJP();
      resultLabel.style.display='none';
    }else{
      // 絞り込み中のヘッダーとラベル
      let parts=[];
      if(searchPlate==='0000')parts.push('全データ');
      else if(hasPlateFilter){const ev=searchPlate.replace(/^0+/,'');if(ev)parts.push('ナンバー:'+ev);}
      if(hasDateFilter)parts.push(searchDate===td?'今日 '+searchDate:searchDate);
      if(statusFilter==='in')parts.push('入庫中のみ');
      else if(statusFilter==='out')parts.push('出庫済みのみ');
      document.getElementById('today-label').textContent='🔍 '+(parts.join(' ／ ')||'絞り込み中');
      resultLabel.style.display='block';
      resultLabel.textContent=filtered.length?filtered.length+'件が見つかりました':'該当するデータがありません';
    }
  }

  document.getElementById('stat-total').textContent=filtered.length;
  document.getElementById('stat-in').textContent=filtered.filter(r=>!r.outTime).length;
  document.getElementById('stat-out').textContent=filtered.filter(r=>r.outTime).length;
  const list=document.getElementById('record-list');
  const empty=document.getElementById('empty-state');
  if(!filtered.length){list.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  const showDate=hasAnyFilter&&!isDefaultView;
  list.innerHTML=filtered.map(r=>`
    <div class="record-card${showDate?' search-match':''}" ontouchstart="touchStart(event)" ontouchend="touchEnd(event,${r.id})" onclick="openEdit(${r.id})" style="-webkit-tap-highlight-color:rgba(26,86,160,0.15);cursor:pointer">
      <div class="record-card-top">
        <span class="record-name">${esc(r.name)}</span>
        <span class="plate-num">${r.plate}</span>
      </div>
      <div class="record-card-mid">訪問先：${esc(r.dest)||'—'}${showDate?' ／ 📅 '+r.date:''}</div>
      <div class="record-card-bot">
        <span class="time-info">入庫 ${r.inTime}${r.outTime?' ／ 出庫 '+r.outTime:''}</span>
        ${r.outTime
          ?'<span class="badge-out">出庫済み</span>'
          :`<button class="btn-checkout" onclick="event.stopPropagation();checkout(${r.id},event)" ontouchend="event.stopPropagation();checkout(${r.id},event)">出　庫</button>`}
      </div>
    </div>`).join('');
}

function openCsvModal(){
  // 日付ピッカーを今日の日付にリセット
  document.getElementById('csv-date-input').value=today();
  document.getElementById('csv-date-row').classList.remove('show');
  document.getElementById('csv-modal-overlay').classList.add('open');
}
function closeCsvModal(){
  document.getElementById('csv-modal-overlay').classList.remove('open');
}
function closeCsvModalOutside(e){
  if(e.target===document.getElementById('csv-modal-overlay'))closeCsvModal();
}
function toggleDatePicker(){
  document.getElementById('csv-date-row').classList.toggle('show');
}

function doDownloadCSV(mode){
  let filtered=[];
  let label='';
  if(mode==='today'){
    const td=today();
    filtered=records.filter(r=>r.date===td);
    label=td;
  }else if(mode==='date'){
    const d=document.getElementById('csv-date-input').value;
    if(!d){toast('日付を選択してください');return;}
    filtered=records.filter(r=>r.date===d);
    label=d;
  }else if(mode==='all'){
    filtered=[...records].sort((a,b)=>a.date.localeCompare(b.date)||a.inTime.localeCompare(b.inTime));
    label='全期間';
  }
  if(!filtered.length){toast('該当するデータがありません');closeCsvModal();return;}
  const bom='\uFEFF';
  const header='日付,入庫時刻,出庫時刻,訪問者名,訪問先,ナンバー\n';
  const rows=filtered.map(r=>[r.date,r.inTime,r.outTime||'','"'+r.name+'"','"'+(r.dest||'')+'"',r.plate].join(',')).join('\n');
  const csv=bom+header+rows;
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='入出庫記録_'+label+'.csv';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
  closeCsvModal();
  toast('CSVを保存しました（'+filtered.length+'件）');
}

// ===== LocalStorage全削除 =====
function confirmClearStorage(){
  document.getElementById('confirm-modal-overlay').classList.add('open');
}
function closeConfirmModal(){
  document.getElementById('confirm-modal-overlay').classList.remove('open');
}
function executeClearStorage(){
  try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
  records=[];
  closeConfirmModal();
  renderList();
  toast('すべてのデータを削除しました');
}

// ===== CSV上書き読み込み =====
let importFile=null;

function openImportModal(){
  importFile=null;
  document.getElementById('csv-import-input').value='';
  document.getElementById('import-file-name').textContent='';
  document.getElementById('btn-do-import').style.display='none';
  document.getElementById('import-modal-overlay').classList.add('open');
}
function closeImportModal(){
  document.getElementById('import-modal-overlay').classList.remove('open');
  importFile=null;
}
function closeImportModalOutside(e){
  if(e.target===document.getElementById('import-modal-overlay'))closeImportModal();
}
function onCsvFileSelected(inp){
  const file=inp.files[0];
  if(!file){importFile=null;document.getElementById('btn-do-import').style.display='none';return;}
  importFile=file;
  document.getElementById('import-file-name').textContent='📄 '+file.name;
  document.getElementById('btn-do-import').style.display='block';
}

function parseCSVLine(line){
  const result=[];
  let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){inQ=!inQ;}
    else if(c===','&&!inQ){result.push(cur.trim());cur='';}
    else{cur+=c;}
  }
  result.push(cur.trim());
  return result;
}

function doImportCSV(){
  if(!importFile){toast('ファイルを選択してください');return;}
  const mode=document.getElementById('import-mode').value;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      let text=e.target.result;
      if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
      const lines=text.split(/\r?\n/).filter(l=>l.trim());
      if(lines.length<2){toast('データが見つかりませんでした');return;}
      const imported=[];
      for(let i=1;i<lines.length;i++){
        const cols=parseCSVLine(lines[i]);
        if(cols.length<6)continue;
        const [date,inTime,outTime,name,dest,plate]=cols;
        if(!date||!inTime||!plate)continue;
        imported.push({
          id:Date.now()+i,
          date:date.trim(),
          inTime:inTime.trim(),
          outTime:outTime.trim()||null,
          name:name.replace(/^"|"$/g,'').trim()||'不明',
          dest:dest.replace(/^"|"$/g,'').trim()||'',
          plate:plate.trim()
        });
      }
      if(!imported.length){toast('有効なデータが見つかりませんでした');return;}
      if(mode==='overwrite'){
        records=imported;
        saveRecords();
        closeImportModal();
        renderList();
        toast('上書き完了：'+imported.length+'件を読み込みました');
      }else{
        const existKeys=new Set(records.map(r=>r.date+'|'+r.inTime+'|'+r.plate));
        const newOnes=imported.filter(r=>!existKeys.has(r.date+'|'+r.inTime+'|'+r.plate));
        records=[...records,...newOnes];
        records.sort((a,b)=>a.date.localeCompare(b.date)||a.inTime.localeCompare(b.inTime));
        saveRecords();
        closeImportModal();
        renderList();
        toast('追記完了：'+newOnes.length+'件を追加しました（重複除外済）');
      }
    }catch(err){
      toast('CSVの読み込みに失敗しました');
      console.error(err);
    }
  };
  reader.readAsText(importFile,'UTF-8');
}

document.getElementById('search-date').value=today();
document.getElementById('btn-date-clear').style.display='inline-block';
renderList();
</script>
</body>
</html>
